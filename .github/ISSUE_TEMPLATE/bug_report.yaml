---
name: Bug Report
description: Report a bug encountered while using Payment Core
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Welcome to the Payment Core issue tracker! Before creating an issue, please consider the following:

        1. This tracker should only be used to report bugs and request features / enhancements to Payment Core.
            - For questions and general support, check the [documentation](https://integrations.frappe.cloud/integrations/payment-integration/payment-core/payment-overview) or use the [forum](https://discuss.frappe.io/) to get input from the open source community.
        2. When making a bug report, make sure you provide all required information. The easier it is for
           maintainers to reproduce, the faster it'll be fixed.
        3. If you think you know what the reason for the bug is, share it with us. Maybe put in a PR 😉

  - type: textarea
    id: bug-info
    attributes:
      label: Information about bug
      description: Also tell us, what did you expect to happen? If applicable, add screenshots to help explain your problem.
      placeholder: Please provide as much information as possible.
    validations:
      required: true

  - type: textarea
    id: exact-version
    attributes:
      label: Version
      description: Share the exact versions of Frappe, ERPNext, Payment Core, and the provider app (if applicable) you are using.
      placeholder: |
        Frappe version -
        ERPNext version -
        Payment Core version -
        Provider app and version (if applicable) -
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Installation method
      options:
        - docker
        - easy-install
        - manual install
        - FrappeCloud
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output / Stack trace / Full Error Message.
      description: Please copy and paste any relevant log output after removing credentials and other secrets. This will be automatically formatted.
      render: shell
...
