---
name: Feature Request
description: Suggest an idea to improve Payment Core
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        Welcome to the Payment Core issue tracker! Before submitting a request, please consider the following:

        1. This tracker should only be used to report bugs and request features / enhancements to Payment Core.
            - For questions and general support, check the [documentation](https://integrations.frappe.cloud/integrations/payment-integration/payment-core/payment-overview) or use the [forum](https://discuss.frappe.io/) to get input from the open source community.
        2. Use the search function before creating a new issue. Duplicates will be closed and directed to
           the original discussion.
        3. Payment Core contains provider-neutral payment contracts and workflows. Provider-specific credentials, APIs, checkout interfaces, webhooks, reconciliation, and branding belong in separate provider apps.
        4. When making a feature request, make sure to be as detailed as possible. The better you convey your message, the easier it is to evaluate.

  - type: textarea
    id: problem-info
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: A clear and concise description of what the problem is. For example, I'm always frustrated when [...]
      placeholder: Please provide as much information as possible.

  - type: textarea
    id: solution-info
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.

  - type: textarea
    id: alternatives-info
    attributes:
      label: Describe the alternatives you've considered
      description: A clear and concise description of any alternative solutions or features you've considered.

  - type: textarea
    id: additional-info
    attributes:
      label: Additional context
      description: Add any other context or screenshots about the feature request here.
...
